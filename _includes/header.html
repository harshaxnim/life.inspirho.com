<header id="masthead" class="site-header" role="banner">
			<div class="site-header-main">
				<div class="site-branding">
					{%- if paginator %}
					<h1 class="site-title"><a href="{{ '/' | relative_url }}" rel="home">{{ site.title }}</a></h1>
					{%- else %}
					<p class="site-title"><a href="{{ '/' | relative_url }}" rel="home">{{ site.title }}</a></p>
					{%- endif %}
					<p class="site-description">{{ site.description }}</p>
				</div><!-- .site-branding -->

				<button id="menu-toggle" class="menu-toggle">Menu</button>

				<div id="site-header-menu" class="site-header-menu">
					<nav id="site-navigation" class="main-navigation" role="navigation" aria-label="Primary Menu">
						{% include menu-primary.html id="menu-navigator" %}
					</nav><!-- .main-navigation -->

					<nav id="social-navigation" class="social-navigation" role="navigation" aria-label="Social Links Menu">
						{% include menu-social.html id="menu-social" %}
					</nav><!-- .social-navigation -->
				</div><!-- .site-header-menu -->
			</div><!-- .site-header-main -->
		</header><!-- .site-header -->
